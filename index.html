<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пульт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0a0d0a;
    --card: #121712;
    --line: rgba(215, 181, 106, 0.28);
    --brass: #d7b56a;
    --moss: #93c48d;
    --paper: #f3eee4;
    --mute: #9a9083;
    --ink: #1a1408;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--paper); }
  body { font-family: "Segoe UI", system-ui, sans-serif; }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  header { padding: 18px 18px 8px; }
  .eyebrow {
    margin: 0;
    color: var(--brass);
    letter-spacing: 0.16em;
    font-size: 11px;
    text-transform: uppercase;
  }
  h1 {
    margin: 4px 0 0;
    font-family: Palatino, Georgia, serif;
    font-weight: 500;
    font-size: 32px;
  }
  main { flex: 1; padding: 8px 18px 96px; }
  .view { display: none; }
  .view.on { display: block; }
  .thread { display: flex; flex-direction: column; gap: 10px; min-height: 220px; }
  .bubble {
    max-width: 88%;
    padding: 12px 14px;
    border-radius: 16px;
    line-height: 1.4;
    font-size: 15px;
  }
  .bubble.bot { background: #161b16; color: var(--paper); border-bottom-left-radius: 6px; }
  .bubble.me { align-self: flex-end; background: var(--brass); color: var(--ink); border-bottom-right-radius: 6px; }
  label { display: block; margin: 16px 0 8px; color: var(--brass); font-size: 13px; }
  textarea, input[type="password"] {
    width: 100%;
    background: var(--card);
    color: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    font: inherit;
    font-size: 16px;
  }
  textarea { min-height: 88px; resize: vertical; }
  .row { display: flex; gap: 8px; }
  .choice, .send, .ghost {
    border: 0;
    border-radius: 14px;
    padding: 12px 10px;
    font: inherit;
    font-size: 14px;
  }
  .choice, .ghost {
    flex: 1;
    background: transparent;
    color: var(--paper);
    border: 1px solid var(--line);
  }
  .choice.on { background: var(--brass); color: var(--ink); border-color: var(--brass); }
  .send {
    width: 100%;
    margin-top: 12px;
    background: var(--brass);
    color: var(--ink);
    font-weight: 700;
    padding: 14px;
  }
  .ghost { margin-top: 8px; width: 100%; }
  input[type="range"] { width: 100%; margin-top: 12px; accent-color: var(--brass); }
  .scale { display: flex; justify-content: space-between; color: var(--mute); font-size: 12px; }
  .note { color: var(--mute); font-size: 13px; line-height: 1.45; }
  .stage { display: flex; justify-content: center; margin: 8px 0 4px; }
  .device {
    width: min(100%, 280px);
    background: #070907;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px;
  }
  .screen {
    background: #0c100c;
    border-radius: 8px;
    aspect-ratio: 4 / 3;
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
  }
  .screen.portrait { aspect-ratio: 3 / 4; }
  .screen .kicker { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--moss); }
  .screen p {
    margin: 10px 0 0;
    font-family: Palatino, Georgia, serif;
    color: var(--moss);
    line-height: 1.35;
    white-space: pre-wrap;
  }
  .screen.amber p, .screen.amber .kicker { color: var(--brass); }
  .screen.slate p, .screen.slate .kicker { color: #c5c6c0; }
  nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    gap: 8px;
    padding: 10px 18px calc(10px + env(safe-area-inset-bottom));
    background: rgba(10, 13, 10, 0.94);
    border-top: 1px solid var(--line);
  }
  nav button {
    flex: 1;
    border: 0;
    border-radius: 14px;
    padding: 12px;
    background: transparent;
    color: var(--mute);
    font: inherit;
  }
  nav button.on { background: #1a160f; color: var(--brass); }
  .hint {
    display: none;
    margin-top: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    background: #16120c;
    color: var(--brass);
    font-size: 13px;
    line-height: 1.4;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <p class="eyebrow">Терминал</p>
    <h1 id="title">Чат</h1>
  </header>
  <main>
    <section id="chat" class="view on">
      <div class="thread" id="thread">
        <div class="bubble bot">Напишите вопрос как в обычном чате. Ответ придёт сообщением от бота, короткая версия — на экран платы.</div>
      </div>
      <label for="ask">Вопрос</label>
      <textarea id="ask" maxlength="2000" placeholder="Спросите что угодно"></textarea>
      <label for="key">Ключ Gemini, один раз</label>
      <input id="key" type="password" maxlength="110" placeholder="Бесплатный, с aistudio.google.com" autocomplete="off">
      <button class="send" id="askSend" type="button">Спросить</button>
      <p class="note">Без ключа бот только кладёт текст на экран. С ключом отвечает в чате. У бесплатного Gemini есть лимиты Google.</p>
    </section>
    <section id="device" class="view">
      <div class="stage">
        <div class="device">
          <div id="screen" class="screen">
            <div class="kicker">Чтение</div>
            <p id="preview">Здесь появится текст.</p>
          </div>
        </div>
      </div>
      <label for="screenText">Текст на экран</label>
      <textarea id="screenText" maxlength="3500" placeholder="Заметка, которую нужно просто показать"></textarea>
      <label>Положение</label>
      <div class="row">
        <button type="button" class="choice on" data-orient="h">Горизонтально</button>
        <button type="button" class="choice" data-orient="v">Вертикально</button>
      </div>
      <label>Цвет</label>
      <div class="row">
        <button type="button" class="choice on" data-theme="green">Зелёный</button>
        <button type="button" class="choice" data-theme="amber">Янтарь</button>
        <button type="button" class="choice" data-theme="slate">Серый</button>
      </div>
      <label for="light">Яркость <span id="lightValue">максимум</span></label>
      <div class="row">
        <button type="button" class="choice" data-light="32">Тускло</button>
        <button type="button" class="choice" data-light="140">Средне</button>
        <button type="button" class="choice on" data-light="255">Максимум</button>
      </div>
      <input id="light" type="range" min="8" max="255" value="255">
      <div class="scale"><span>Ночь</span><span>На полную</span></div>
      <button class="send" id="apply" type="button">Показать на экране</button>
      <button class="ghost" id="clear" type="button">Очистить экран</button>
    </section>
    <div class="hint" id="hint"></div>
  </main>
  <nav>
    <button type="button" class="on" data-tab="chat">Чат</button>
    <button type="button" data-tab="device">Экран</button>
  </nav>
</div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
const state = { orient: "h", theme: "green", tab: "chat" };
const hint = document.getElementById("hint");
if (tg) {
  tg.ready();
  tg.expand();
  if (tg.setHeaderColor) tg.setHeaderColor("#0a0d0a");
  if (tg.setBackgroundColor) tg.setBackgroundColor("#0a0d0a");
  if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
}

document.querySelectorAll("[data-tab]").forEach((button) => {
  button.addEventListener("click", () => {
    state.tab = button.dataset.tab;
    document.querySelectorAll("[data-tab]").forEach((item) => item.classList.toggle("on", item === button));
    document.getElementById("chat").classList.toggle("on", state.tab === "chat");
    document.getElementById("device").classList.toggle("on", state.tab === "device");
    document.getElementById("title").textContent = state.tab === "chat" ? "Чат" : "Экран";
  });
});

const screen = document.getElementById("screen");
const preview = document.getElementById("preview");
const screenText = document.getElementById("screenText");
function paint() {
  screen.className = "screen" + (state.orient === "v" ? " portrait" : "") + " " + state.theme;
  preview.textContent = screenText.value.trim() || "Здесь появится текст.";
}
screenText.addEventListener("input", paint);
document.querySelectorAll("[data-orient]").forEach((button) => {
  button.addEventListener("click", () => {
    state.orient = button.dataset.orient;
    document.querySelectorAll("[data-orient]").forEach((item) => item.classList.toggle("on", item === button));
    paint();
  });
});
document.querySelectorAll("[data-theme]").forEach((button) => {
  button.addEventListener("click", () => {
    state.theme = button.dataset.theme;
    document.querySelectorAll("[data-theme]").forEach((item) => item.classList.toggle("on", item === button));
    paint();
  });
});
const light = document.getElementById("light");
const lightValue = document.getElementById("lightValue");
function lightName(value) {
  const level = Number(value);
  if (level >= 250) return "максимум";
  if (level >= 120) return "средне";
  if (level <= 40) return "тускло";
  return String(level);
}
function syncLight(value) {
  light.value = value;
  lightValue.textContent = lightName(value);
  document.querySelectorAll("[data-light]").forEach((item) => {
    item.classList.toggle("on", Number(item.dataset.light) === Number(value));
  });
}
document.querySelectorAll("[data-light]").forEach((button) => {
  button.addEventListener("click", () => syncLight(button.dataset.light));
});
light.addEventListener("input", () => syncLight(light.value));

function send(body) {
  if (tg && typeof tg.sendData === "function") {
    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");
    tg.sendData(JSON.stringify(body));
    return;
  }
  hint.style.display = "block";
  hint.textContent = "Откройте пульт кнопкой «Пульт» внизу чата. Из меню Telegram сообщение на плату не уходит.";
}

document.getElementById("askSend").addEventListener("click", () => {
  const text = document.getElementById("ask").value.trim();
  if (!text) return;
  const thread = document.getElementById("thread");
  const mine = document.createElement("div");
  mine.className = "bubble me";
  mine.textContent = text;
  thread.appendChild(mine);
  send({
    mode: "chat",
    text: text,
    key: document.getElementById("key").value.trim()
  });
});

document.getElementById("apply").addEventListener("click", () => {
  send({
    mode: "screen",
    text: screenText.value.trim(),
    orient: state.orient,
    theme: state.theme,
    light: Number(light.value),
    clear: false
  });
});
document.getElementById("clear").addEventListener("click", () => {
  send({ mode: "screen", text: "", orient: state.orient, theme: state.theme, light: Number(light.value), clear: true });
});
paint();
</script>
</body>
</html>
